<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutureLearn Study Library</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 18px; font: 15px/1.5 system-ui, sans-serif; color: #18212b; }
    button { margin: 4px; padding: 8px 12px; border: 0; border-radius: 6px; background: #0757a5; color: white; cursor: pointer; }
    button.danger { background: #9c2835; }
    article { margin: 16px 0; padding: 16px; border: 1px solid #cbd3dc; border-radius: 8px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f6f8; padding: 12px; }
    details { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Study library</h1>
  <p>Lessons and AI drafts saved in this browser. Review comments before using them; the library does not mark course work complete.</p>
  <button id="export">Export all lessons (JSON)</button><button id="clear" class="danger">Delete library</button>
  <main id="lessons"></main>
  <script src="library.js"></script>
</body>
</html>
